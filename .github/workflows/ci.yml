name: CI

on:
  pull_request:
    # labeled: adding the update-snapshots label regenerates the reference screenshots (see the e2e job).
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  # Run by the e2e job after it pushes new reference screenshots: a push made with GITHUB_TOKEN starts no workflow.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event.action != 'labeled' || github.event.label.name == 'update-snapshots'
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      docker: ${{ steps.filter.outputs.docker }}
      camunda: ${{ steps.filter.outputs.camunda }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - '**'
              - '!docs/**'
              - '!backlog/**'
              - '!glossary/**'
              - '!**/*.md'
            docker:
              - 'docker/**'
              - 'packages/**'
              - 'NOCOBASE_VERSION'
              - 'package.json'
              - '.github/workflows/ci.yml'
            camunda:
              - 'docker-compose.yml'
              - 'docker/docker-compose.yml'
              - 'docker/.env.example'
              - 'docker/camunda/**'
              - 'CAMUNDA_VERSION'
              - '.github/workflows/ci.yml'

  checks:
    name: Lightweight checks
    if: github.event.action != 'labeled' || github.event.label.name == 'update-snapshots'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Glossary format
        run: node tools/check-glossary.js
      - name: NocoBase version pin
        run: node tools/check-nocobase-version.js
      - name: Camunda version pin
        run: node tools/check-camunda-version
      - name: Tool tests
        run: node --test 'tools/**/__tests__/*.test.js'
      - name: Translations vs glossary
        run: node tools/glossary-check packages/plugins/@persian-erp
      - name: Reference modules against the module standard
        run: node tools/check-module modules/*/*.erp-module.json

  build-test:
    name: Install, lint, build, test
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      # The BPMN engine of decision 0007, for the OperatonEngine tests of plugin-bpm (H2 is enough here).
      operaton:
        image: operaton/operaton:2.1.5
        env:
          OPERATON_BPM_RUN_AUTH_ENABLED: 'true'
          OPERATON_BPM_RUN_EXAMPLE_ENABLED: 'false'
          OPERATON_BPM_ADMIN_USER_ID: nocobase
          OPERATON_BPM_ADMIN_USER_PASSWORD: secret
        ports:
          - 18080:8080
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nocobase
          POSTGRES_PASSWORD: nocobase
          POSTGRES_DB: nocobase
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nocobase"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The branch itself, not the merge commit, so new reference screenshots can be pushed back to it.
          ref: ${{ env.CAN_PUSH == 'true' && github.head_ref || '' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache yarn
        uses: actions/cache@v4
        with:
          path: ~/.cache/yarn
          key: yarn-${{ runner.os }}-${{ hashFiles('package.json', 'yarn.lock', 'packages/plugins/**/package.json') }}
          restore-keys: yarn-${{ runner.os }}-
      - name: Prepare env files
        run: |
          cp .env.example .env
          sed -i "s#^APP_KEY=.*#APP_KEY=ci-$(openssl rand -hex 32)#" .env
          cp .env .env.test
          sed -i "s#^APP_ENV=.*#APP_ENV=test#" .env.test
      - name: Install
        run: yarn install --ignore-engines --network-timeout 600000
      - name: Upload generated yarn.lock
        if: hashFiles('yarn.lock') != ''
        uses: actions/upload-artifact@v4
        with:
          name: yarn-lock
          path: yarn.lock
      - name: Translation coverage
        run: |
          node tools/i18n-report
          { echo '### Translation coverage'; echo '```'; node tools/i18n-report; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # Runs again here with the en-US sources installed, so placeholders are checked against the real text.
      - name: Translations vs glossary (with en-US sources)
        run: node tools/glossary-check packages/plugins/@persian-erp
      - name: Lint
        run: yarn eslint packages/plugins/@persian-erp tools
      - name: Build plugins
        run: yarn build @persian-erp/plugin-fa @persian-erp/plugin-modules @persian-erp/plugin-bpm --no-dts
      - name: Wait for the BPMN engine
        run: |
          for i in $(seq 1 60); do
            curl -sf -u nocobase:secret http://localhost:18080/engine-rest/version && exit 0
            sleep 3
          done
          echo "Operaton did not start"; exit 1
      - name: Test
        env:
          OPERATON_URL: http://localhost:18080
        run: yarn test --server packages/plugins/@persian-erp --run
      - name: Client tests
        run: yarn test --client packages/plugins/@persian-erp --run

  e2e:
    name: E2E (Persian and RTL)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      # Same-repo pull requests can receive commits with new reference screenshots; forks only compare.
      CAN_PUSH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
      UPDATE_ALL: ${{ contains(github.event.pull_request.labels.*.name, 'update-snapshots') }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nocobase
          POSTGRES_PASSWORD: nocobase
          POSTGRES_DB: nocobase
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nocobase"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The branch itself, not the merge commit, so new reference screenshots can be pushed back to it.
          ref: ${{ env.CAN_PUSH == 'true' && github.head_ref || '' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache yarn
        uses: actions/cache@v4
        with:
          path: ~/.cache/yarn
          key: yarn-${{ runner.os }}-${{ hashFiles('package.json', 'yarn.lock', 'packages/plugins/**/package.json') }}
          restore-keys: yarn-${{ runner.os }}-
      - name: Prepare env file
        run: |
          cp .env.example .env
          sed -i "s#^APP_KEY=.*#APP_KEY=ci-$(openssl rand -hex 32)#" .env
      - name: Install
        run: yarn install --ignore-engines --network-timeout 600000
      - name: Build plugins
        run: yarn build @persian-erp/plugin-fa @persian-erp/plugin-modules --no-dts
      - name: Install and start NocoBase
        run: |
          yarn start --quickstart -d
          for i in $(seq 1 120); do
            curl -sf http://localhost:13000/api/__health_check && exit 0
            sleep 5
          done
          echo "NocoBase did not start"; yarn pm2 logs --nostream --lines 200 || true; exit 1
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      # Missing reference screenshots are written instead of failing; with the update-snapshots label all of them
      # are rewritten. Existing references are compared otherwise.
      - name: Run e2e tests
        run: npx playwright test -c e2e/playwright.config.ts --update-snapshots=${{ env.UPDATE_ALL == 'true' && 'changed' || 'missing' }}
      - name: Commit reference screenshots
        if: env.CAN_PUSH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(git status --porcelain e2e/__screenshots__)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add e2e/__screenshots__
            git commit -m "Update e2e reference screenshots"
            git push origin HEAD:${{ github.head_ref }}
            gh workflow run ci.yml --ref ${{ github.head_ref }} || echo "Could not start CI on the new commit; push again to run it."
            echo "### Reference screenshots updated and pushed to ${{ github.head_ref }}" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$UPDATE_ALL" = 'true' ]; then
            gh api -X DELETE "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels/update-snapshots" || true
          fi
      - name: Upload screenshots and report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            storage/playwright/e2e-results
            storage/playwright/e2e-report

  # The task inbox of plugin-bpm with a real BPMN engine (STORY-082). Separate from the job above, so its
  # screenshots and settings pages stay without the plugin.
  e2e-bpm:
    name: E2E (BPMN)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      operaton:
        image: operaton/operaton:2.1.5
        env:
          OPERATON_BPM_RUN_AUTH_ENABLED: 'true'
          OPERATON_BPM_RUN_EXAMPLE_ENABLED: 'false'
          OPERATON_BPM_ADMIN_USER_ID: nocobase
          OPERATON_BPM_ADMIN_USER_PASSWORD: secret
        ports:
          - 18080:8080
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nocobase
          POSTGRES_PASSWORD: nocobase
          POSTGRES_DB: nocobase
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nocobase"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache yarn
        uses: actions/cache@v4
        with:
          path: ~/.cache/yarn
          key: yarn-${{ runner.os }}-${{ hashFiles('package.json', 'yarn.lock', 'packages/plugins/**/package.json') }}
          restore-keys: yarn-${{ runner.os }}-
      - name: Prepare env file
        run: |
          cp .env.example .env
          sed -i "s#^APP_KEY=.*#APP_KEY=ci-$(openssl rand -hex 32)#" .env
          sed -i "s#^APPEND_PRESET_BUILT_IN_PLUGINS=.*#&,@persian-erp/plugin-bpm#" .env
          sed -i "s#^BPM_ENGINE_PASSWORD=.*#BPM_ENGINE_PASSWORD=secret#" .env
          printf 'BPM_ENGINE_URL=http://localhost:18080\nBPM_WORKER_INTERVAL=1000\n' >> .env
      - name: Install
        run: yarn install --ignore-engines --network-timeout 600000
      - name: Build plugins
        run: yarn build @persian-erp/plugin-fa @persian-erp/plugin-modules @persian-erp/plugin-bpm --no-dts
      - name: Wait for the BPMN engine
        run: |
          for i in $(seq 1 60); do
            curl -sf -u nocobase:secret http://localhost:18080/engine-rest/version && exit 0
            sleep 5
          done
          echo "Operaton did not start"; exit 1
      - name: Install and start NocoBase
        run: |
          yarn start --quickstart -d
          for i in $(seq 1 120); do
            curl -sf http://localhost:13000/api/__health_check && exit 0
            sleep 5
          done
          echo "NocoBase did not start"; yarn pm2 logs --nostream --lines 200 || true; exit 1
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run e2e tests
        run: BPM_E2E=1 npx playwright test -c e2e/playwright.config.ts e2e/bpm e2e/modules/all-modules.e2e.ts
      - name: Upload screenshots and report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-bpm-results
          path: |
            storage/playwright/e2e-results
            storage/playwright/e2e-report

  # Camunda 8 of the bpm profile (STORY-091), with each Compose file: the engine starts with its history in the
  # camunda database, refuses requests without a password, answers the service user and publishes no port.
  camunda:
    name: Camunda 8 (Compose)
    needs: changes
    if: needs.changes.outputs.camunda == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compose: [development, server]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare env file
        run: |
          if [ "${{ matrix.compose }}" = server ]; then
            sed -e "s#change-me#ci-$(openssl rand -hex 16)#" docker/.env.example > docker/.env
          else
            cp .env.example .env
          fi
      - name: Start the engine
        working-directory: ${{ matrix.compose == 'server' && 'docker' || '.' }}
        run: docker compose --profile bpm up -d camunda
      - name: Check the engine
        working-directory: ${{ matrix.compose == 'server' && 'docker' || '.' }}
        run: sh "$GITHUB_WORKSPACE/docker/camunda/check.sh"
      - name: Logs
        if: failure()
        working-directory: ${{ matrix.compose == 'server' && 'docker' || '.' }}
        run: docker compose --profile bpm logs camunda-init camunda | tail -300

  # Builds the Persian image (docker/build.sh) and smoke-tests a fresh install of it with docker/docker-compose.yml.
  # Nothing is pushed; publishing is the release workflow's job (STORY-062).
  docker-image:
    name: Docker image (build and smoke test)
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache yarn
        uses: actions/cache@v4
        with:
          path: ~/.cache/yarn
          key: yarn-${{ runner.os }}-${{ hashFiles('package.json', 'yarn.lock', 'packages/plugins/**/package.json') }}
          restore-keys: yarn-${{ runner.os }}-
      - name: Install
        run: |
          cp .env.example .env
          yarn install --ignore-engines --network-timeout 600000
      - name: Build image
        run: docker/build.sh persian-erp:ci
      - name: Image carries the pinned NocoBase version
        run: |
          label="$(docker image inspect persian-erp:ci --format '{{ index .Config.Labels "com.nocobase.version" }}')"
          test "$label" = "$(cat NOCOBASE_VERSION)" || { echo "image label $label != NOCOBASE_VERSION"; exit 1; }
      - name: Image carries plugin-bpm
        run: |
          docker run --rm --entrypoint test persian-erp:ci -f /app/nocobase/node_modules/@persian-erp/plugin-bpm/dist/server/index.js
      - name: Start a fresh install
        working-directory: docker
        run: |
          sed -e 's#^IMAGE=.*#IMAGE=persian-erp#' -e 's#^IMAGE_TAG=.*#IMAGE_TAG=ci#' \
              -e "s#change-me#ci-$(openssl rand -hex 16)#" .env.example > .env
          docker compose up -d
          for i in $(seq 1 120); do
            curl -sf http://localhost:13000/api/__health_check && exit 0
            sleep 5
          done
          echo "The image did not start"; docker compose logs app | tail -200; exit 1
      - name: Server time zone is Tehran
        working-directory: docker
        run: test "$(docker compose exec -T app date +%z)" = "+0330"
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Smoke test
        run: |
          set -a; . docker/.env; set +a
          npx playwright test -c docker/smoke/playwright.config.ts
      - name: Logs
        if: failure()
        working-directory: docker
        run: docker compose logs app | tail -300
